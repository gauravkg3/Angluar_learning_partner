<div class="container">
    <div class="header">
      <h1><span class="l">L</span>OGIN</h1>
    </div>
    <form>
      <label for="uname">Username</label>
      <input type="text" class="inp" name="email" required [(ngModel)]="userObj.email">
      <label for="psw">Password</label>
      <input type="password" class="inp" name="password" required [(ngModel)]="userObj.password">
      <button type="button" (click)="onLogin()">Sign In</button>
    </form>
    <div class="signup">
      <b>Don't have account?</b>
      <a href="#">Sign up</a>
    </div>
  </div>
